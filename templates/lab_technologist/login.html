<!-- templates/lab_technologist/login.html -->
{% extends 'lab_technologist/base.html' %}
{% load static %}

{% block title %}Login - Lab Technologist{% endblock %}

{% block auth_content %}
<form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus>
    </div>
    
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    
    <div class="d-grid">
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </div>
    
    <a href="javascript:void(0)" class="text-secondary" onclick="alert('Password reset functionality is currently unavailable. Please contact support.'); return false;">
        <i class="fas fa-key mr-1"></i> Forgot password?
    </a>
    
    <div class="mt-2 text-center">
        <p>Don't have an account? <a href="{% url 'lab_technologist:signup' %}">Register here</a></p>
    </div>
</form>

<div class="text-center mt-3">
    <small class="text-muted">Authorized laboratory personnel only</small>
</div>
{% endblock %}
