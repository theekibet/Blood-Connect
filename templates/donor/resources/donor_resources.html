{% extends 'donor/donorbase.html' %}
{% load static %}

{% block title %}Resources - BloodConnect{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4"><i class="fas fa-book text-primary me-2"></i>Donor Resources</h2>
    
    <div class="row">
        <div class="col-md-4 mb-3">
            <a href="{% url 'donor:health-tips' %}" class="text-decoration-none">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-heartbeat fa-3x text-primary mb-3"></i>
                        <h5>Health Tips</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4 mb-3">
            <a href="{% url 'donor:faqs' %}" class="text-decoration-none">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-question-circle fa-3x text-info mb-3"></i>
                        <h5>FAQs</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4 mb-3">
            <a href="{% url 'donor:donor-advice' %}" class="text-decoration-none">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-comments fa-3x text-success mb-3"></i>
                        <h5>Donor Advice</h5>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
