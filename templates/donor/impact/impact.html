{% extends 'donor/donorbase.html' %}
{% load static %}

{% block title %}Our Impact - BloodConnect{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4"><i class="fas fa-chart-line text-primary me-2"></i>Collective Impact</h2>
    
    <div class="row text-center">
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h1 class="display-4 text-primary">0</h1>
                    <p>Lives Saved</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h1 class="display-4 text-success">0</h1>
                    <p>Donations Made</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h1 class="display-4 text-info">0</h1>
                    <p>Active Supporters</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <a href="{% url 'donor:share-impact' %}" class="btn btn-primary">Share Our Impact</a>
    </div>
</div>
{% endblock %}
