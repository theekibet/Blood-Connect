{% extends 'donor/donorbase.html' %}
{% load static %}

{% block title %}Share Awareness - BloodConnect{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fas fa-share-alt me-2"></i>Share Our Message</h4>
        </div>
        <div class="card-body">
            <p class="lead">Help us spread the word!</p>
            
            <div class="mb-3">
                <label class="form-label">Share on Facebook</label>
                <a href="#" class="btn btn-primary d-block">Share</a>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Share on Twitter</label>
                <a href="#" class="btn btn-info d-block">Tweet</a>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Share via WhatsApp</label>
                <a href="#" class="btn btn-success d-block">Send</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
