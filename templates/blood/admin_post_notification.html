{% extends 'blood/adminbase.html' %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-bell"></i> Post Notification</h6>
    </div>
    <div class="card-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="title">Notification Title:</label>
          <input type="text" class="form-control" id="title" name="title" required>
        </div>

        <div class="form-group">
          <label for="message"><i class="fas fa-comment"></i> Notification Message:</label>
          <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label><i class="fas fa-users"></i> Select Recipient Groups:</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="group_patients" name="recipient_group" value="patient">
            <label class="form-check-label" for="group_patients">All Patients</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="group_donors" name="recipient_group" value="donor">
            <label class="form-check-label" for="group_donors">All Donors</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="group_phlebotomists" name="recipient_group" value="phlebotomist">
            <label class="form-check-label" for="group_phlebotomists">All Phlebotomists</label>
          </div>
        </div>

        <div class="form-group mt-3">
          <label for="recipient_id"><i class="fas fa-user"></i> Or select individual recipients:</label>
          <small class="form-text text-muted mb-2">Hold Ctrl (Cmd on Mac) to select multiple recipients.</small>
          <select class="form-control" id="recipient_id" name="recipient_id" multiple>
            <optgroup label="Patients" id="patient-options">
              {% for patient in patients %}
                {% if patient.user %}
                  <option value="{{ patient.user.id }}" data-type="patient">{{ patient.user.username }}</option>
                {% endif %}
              {% endfor %}
            </optgroup>

            <optgroup label="Donors" id="donor-options">
              {% for donor in donors %}
                {% if donor.user %}
                  <option value="{{ donor.user.id }}" data-type="donor">{{ donor.user.username }}</option>
                {% endif %}
              {% endfor %}
            </optgroup>

            <optgroup label="Phlebotomists" id="phlebotomist-options">
              {% for phlebotomist in phlebotomists %}
                {% if phlebotomist.user %}
                  <option value="{{ phlebotomist.user.id }}" data-type="phlebotomist">{{ phlebotomist.user.username }}</option>
                {% endif %}
              {% endfor %}
            </optgroup>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-3">
          <i class="fas fa-paper-plane"></i> Post Notification
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
