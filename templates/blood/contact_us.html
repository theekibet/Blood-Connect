<!-- CONTACT SECTION WRAPPER -->
<div class="contact-wrapper-single">

    <!-- CONTACT FORM CARD -->
    <div class="contact-card form-card">
        <h2><i class="fas fa-envelope-open-text"></i> Contact Us</h2>

        <p class="subtitle">We'd love to hear from you. Send us a message 👇</p>

        <form action="" method="post" class="contact-form">
            {% csrf_token %}

            <div class="input-field">
                <label><i class="fas fa-user"></i> Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="input-field">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-field">
                <label><i class="fas fa-comment"></i> Message</label>
                <textarea name="message" rows="5" placeholder="Write your message..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>
    </div>

</div>


<!-- MODERN CSS UI/UX -->
<style>
    .contact-wrapper-single {
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        animation: fadeIn 0.7s ease-in-out;
    }

    .contact-card {
        width: 100%;
        max-width: 600px;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        animation: slideUp 0.7s ease;
        transition: transform 0.3s ease;
    }

    .contact-card:hover {
        transform: translateY(-5px);
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    h2 {
        color: #333;
        font-size: 1.8rem;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .subtitle {
        margin-bottom: 25px;
        color: #777;
        font-size: 1rem;
    }

    .input-field {
        margin-bottom: 20px;
    }

    .input-field label {
        font-weight: 600;
        color: #555;
        margin-bottom: 6px;
        display: block;
    }

    .input-field input,
    .input-field textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fafafa;
        font-size: 1rem;
        transition: all 0.2s ease;
    }

    .input-field input:focus,
    .input-field textarea:focus {
        border-color: #4CAF50;
        background: #fff;
        outline: none;
        box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
    }

    .btn-submit {
        width: 100%;
        padding: 14px;
        background: #4CAF50;
        color: white;
        border-radius: 8px;
        border: none;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background: #3e8e41;
        transform: scale(1.03);
        box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }
</style>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
